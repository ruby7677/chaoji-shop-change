<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fffdf7" />
  <meta name="robots" content="noindex" />
  <title>我的訂單｜潮吉好頑</title>
  <!-- LINE SDK 在解析 HTML 時就開始下載，不等 orders-page.js 的 import 樹執行；crossorigin 要與 liff-auth.js 建立的 <script> 一致才會沿用 -->
  <link rel="preload" href="https://static.line-scdn.net/liff/edge/2/sdk.js" as="script" crossorigin="anonymous" />
  <link rel="preconnect" href="https://api.line.me" />
  <link rel="stylesheet" href="/bundle-base.css" />
  <link rel="stylesheet" href="/storefront-details.css" />
  <link rel="stylesheet" href="/bundle-storefront.css" />
  <link rel="stylesheet" href="/orders-page.css" />
  <script type="module" src="/orders-page.js"></script>
  <!-- modulepreload:start（node scripts/build-modulepreload.mjs 產生，請勿手改） -->
  <link rel="modulepreload" href="/product-format.js" />
  <link rel="modulepreload" href="/app-core.js" />
  <link rel="modulepreload" href="/liff-auth.js" />
  <link rel="modulepreload" href="/web-session.js" />
  <link rel="modulepreload" href="/copy-bank-account.js" />
  <link rel="modulepreload" href="/order-views.js" />
  <link rel="modulepreload" href="/orders-session.js" />
  <link rel="modulepreload" href="/embedded-config.js" />
  <link rel="modulepreload" href="/boot-timing.js" />
  <link rel="modulepreload" href="/cvs-delivery.js" />
  <link rel="modulepreload" href="/home-fee-state.js" />
  <link rel="modulepreload" href="/auth-expiry.js" />
  <link rel="modulepreload" href="/liff-restore-policy.js" />
  <!-- modulepreload:end -->
</head>
<body class="orders-page">
  <main class="orders-shell orders-page-shell">
    <header class="orders-page-head">
      <img src="/Logo.webp" width="44" height="44" alt="" aria-hidden="true" />
      <div>
        <p class="eyebrow">MY ORDERS</p>
        <h1>我的訂單</h1>
      </div>
      <button class="orders-page-refresh" type="button" data-orders-refresh aria-label="重新整理訂單">重新整理</button>
    </header>
    <p class="dialog-copy">可查看訂單狀態，匯款訂單可補填匯款帳號末五碼；7-11店到店(交貨便)訂單出貨後可在此查看寄件編號。</p>
    <div id="orders-list" aria-live="polite"><div class="skeleton-stack" role="status" aria-label="載入訂單中"><div class="skeleton-card"><span></span><i></i><i></i></div><div class="skeleton-card"><span></span><i></i><i></i></div></div></div>
    <a class="orders-page-shop" data-shop-link href="/">前往商店逛逛 →</a>
  </main>
  <div class="toast" id="toast" role="status" aria-hidden="true"></div>
  <dialog id="payment-dialog" tabindex="-1" aria-labelledby="payment-dialog-title"><form id="payment-form"><button class="dialog-close" type="button" data-payment-close aria-label="關閉">×</button><p class="eyebrow">PAYMENT</p><h2 id="payment-dialog-title">回報匯款</h2><div id="payment-order-detail"></div><label id="payment-last-five-label">匯款帳號末五碼 <input id="payment-last-five" required maxlength="5" pattern="[0-9]{5}" inputmode="numeric" autocomplete="off" placeholder="請輸入 5 位數字" /></label><p class="form-error hidden" id="payment-error" role="alert"></p><button class="primary-button payment-submit" type="submit">送出末五碼，等待確認</button><button class="text-button" type="button" data-payment-later>稍後再回報</button><p id="payment-store-note" class="dialog-copy hidden">此訂單不需要回報匯款末五碼。</p></form></dialog>
</body>
</html>
